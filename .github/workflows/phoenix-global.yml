name: Collect global Phoenix directories
on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'JSON array of Phoenix country routes (default: all remaining)'
        default: '["bn","kh","ae","sa","in","id","my","hk","tw","th","vn","mn","cn","au","nz","nc","ca","ie","uk","ma","lu","at","be","cz","de","pt","ch","es","fr","us","kr","jp"]'
        required: true
      require_checkpoint:
        description: 'Refuse a fresh collection if the saved country checkpoint cannot be restored'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: phoenix-global-collection
  cancel-in-progress: false
jobs:
  collect:
    name: Collect ${{ matrix.country }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        country: ${{ fromJSON(inputs.countries) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .phoenix-cache
          key: phoenix-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phoenix-${{ matrix.country }}-
      - name: Verify and describe restored collection progress
        env:
          PHOENIX_COUNTRY: ${{ matrix.country }}
          REQUIRE_CHECKPOINT: ${{ inputs.require_checkpoint }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(".phoenix-cache") / os.environ["PHOENIX_COUNTRY"] / "listing.json"
          if not path.exists():
              if os.environ["REQUIRE_CHECKPOINT"] == "true":
                  raise SystemExit("Required saved checkpoint was not restored; refusing to start over")
              print("No saved checkpoint; starting a new country collection")
          else:
              progress = json.loads(path.read_text())
              for key in ("rows", "visited", "next", "complete"):
                  if key not in progress:
                      raise SystemExit(f"Invalid restored checkpoint: missing {key}")
              facts = len([p for p in path.parent.glob("*.json") if p.name != "listing.json"])
              print(f"RESTORED: {len(progress['visited'])} listing pages; "
                    f"{len(progress['rows'])} discovered venues; {facts} cached detail records; "
                    f"listing complete={progress['complete']}; next={progress['next']}", flush=True)
          PY
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s tools -p test_phoenix_global.py
      - run: python -m unittest discover -s tools -p test_phoenix_resume.py
      - name: Collect public business facts, paced and checkpointed
        id: collect
        run: python tools/phoenix_global.py --countries "${PHOENIX_COUNTRY}" --cache .phoenix-cache
        env:
          PHOENIX_COUNTRY: ${{ matrix.country }}
      - name: Save checkpoint independently of publication success
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .phoenix-cache
          key: phoenix-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Rebuild coverage after an interrupted collection
        if: always()
        run: python tools/phoenix_global.py --build-only
      - name: Preserve generated facts and collection audit on GitHub
        if: always()
        run: node tools/publish_phoenix.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PHOENIX_COUNTRY: ${{ matrix.country }}
      - name: Preserve checkpoint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-${{ matrix.country }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            data/phoenix/
            docs/PHOENIX_COVERAGE.md
            .phoenix-cache/
          retention-days: 90
  coverage:
    name: Verify requested country completion
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Report actual country status, not just process success
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: |
          set -o pipefail
          python tools/check_phoenix_coverage.py --countries "$COUNTRIES" | tee -a "$GITHUB_STEP_SUMMARY"
