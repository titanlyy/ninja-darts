name: Deploy Ninja Darts map
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect global Phoenix directories']
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - data/**
      - icons/**
      - vendor/**
      - manifest.webmanifest
      - sw.js
      - .github/workflows/deploy-site.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ninja-darts-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare public map assets only
        run: |
          mkdir -p /tmp/ninja-darts-site
          cp -r index.html css js data icons vendor manifest.webmanifest sw.js .nojekyll /tmp/ninja-darts-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ninja-darts-site
      - name: Publish map
        id: deployment
        uses: actions/deploy-pages@v4
