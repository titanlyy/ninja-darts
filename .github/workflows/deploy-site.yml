name: Deploy Ninja Darts map
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect global Phoenix directories']
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - data/**
      - icons/**
      - vendor/**
      - manifest.webmanifest
      - sw.js
      - package.json
      - package-lock.json
      - tools/build_site.mjs
      - tools/test_*
      - .github/workflows/deploy-site.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ninja-darts-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests beautifulsoup4
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - name: Prepare tested public map assets only
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Publish map
        id: deployment
        uses: actions/deploy-pages@v4
