<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ninja Darts — Global Darts Venue Map</title>
  <meta name="description" content="A map-based global directory of places to play darts. Find DARTSLIVE venues, bars and clubs near you." />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#12100e" />

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" aria-label="Venue search and filters">
      <header class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" role="img" aria-label="Ninja Darts logo">
          <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M24 4 L31 24 L24 44 L17 24 Z" fill="var(--color-accent)" opacity="0.9"/>
        </svg>
        <div class="brand-text">
          <h1>NINJA<span>DARTS</span></h1>
          <p class="brand-tag">Find your next game</p>
        </div>
      </header>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search" type="search" placeholder="Search venue, city or address…" aria-label="Search venues" autocomplete="off" />
      </div>

      <div class="filters">
        <label class="chip"><input type="checkbox" id="f-league" /><span>League venues</span></label>
        <label class="chip"><input type="checkbox" id="f-dl3" /><span>Has DARTSLIVE3</span></label>
        <button class="chip" id="near-me" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="8"/></svg>
          <span>Near me</span>
        </button>
      </div>

      <nav class="country-list" id="country-list" aria-label="Countries">
        <div class="loading-skeleton" aria-hidden="true"></div>
      </nav>

      <footer class="sidebar-foot">
        <p id="venue-count">Loading venues…</p>
        <p class="credit">Data: <a href="https://search.dartslive.com/" target="_blank" rel="noopener">DARTSLIVE</a> · Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OSM</a></p>
      </footer>
    </aside>

    <button id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>

    <!-- Map -->
    <main id="map" role="application" aria-label="Interactive darts venue map"></main>

    <!-- Venue detail panel -->
    <section id="detail" class="hidden" aria-live="polite" aria-label="Venue details">
      <button class="detail-close" id="detail-close" aria-label="Close details">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="detail-body"></div>
    </section>

    <div id="toast" class="hidden" role="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
